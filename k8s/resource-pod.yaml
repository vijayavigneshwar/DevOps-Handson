apiVersion: v1
kind: Pod
metadata:
  name: resource-demo
spec:
  containers:
  - name: stree-app
    image: polinux/stress
    resources:
      requests:
        memory: "50Mi"
        cpu: "100m"
      limits:
        memory: "100Mi"
        cpu: "200m"
    command: ["stress"]
    args: ["--vm", "1", "--vm-bytes", "80M", "--vm-hang", "1"]